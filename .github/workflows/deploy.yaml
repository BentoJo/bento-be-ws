name: Deploy Gateway Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # LOGIN TO GHCR (machine user) 
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_BOT_USERNAME }}
          password: ${{ secrets.CI_BOT_TOKEN }}

      # BUILD & PUSH
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bentojo/bento-be-workspace-ws-service:latest
            ghcr.io/bentojo/bento-be-workspace-ws-service:${{ github.sha }}

        # DEPLOY
      - name: Debug VPS Info
        run: |
          echo "Host exists: ${{ secrets.VPS_HOST != '' }}"
          echo "User exists: ${{ secrets.VPS_USER != '' }}"
          echo "Key exists: ${{ secrets.VPS_SSH_KEY != '' }}"
