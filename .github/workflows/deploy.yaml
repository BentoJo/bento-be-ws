name: Deploy WS Service

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Don't let two deploys race; cancel an in-progress one when a newer push lands.
concurrency:
  group: deploy-ws-service
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The VPS builds the image from source (podman, local build) and runs it
      # from docker-compose.yml. So the deploy just syncs the repo and rebuilds.
      # All config is supplied at RUNTIME via the compose env_file on the server —
      # nothing secret is baked into the image. --force-recreate guarantees the
      # container is replaced (and env_file re-read) even if the image is cached.
      - name: Deploy to VPS (build on server)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /apps/bento-be-ws
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.yml up -d --build --force-recreate ws-service
            docker image prune -f
            sleep 5
            docker compose -f docker-compose.yml ps
            test "$(docker inspect -f '{{.State.Running}}' ws-service)" = "true"
            echo "ws-service is running"
