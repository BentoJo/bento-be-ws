name: Deploy Gateway Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Test SSH Port
        run: |
          timeout 10 bash -c "</dev/tcp/${{ secrets.VPS_HOST }}/22"

      - uses: actions/checkout@v4

      # LOGIN TO GHCR (machine user) 
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_BOT_USERNAME }}
          password: ${{ secrets.CI_BOT_TOKEN }}

      # BUILD & PUSH
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bentojo/bento-be-workspace-ws-service:latest
            ghcr.io/bentojo/bento-be-workspace-ws-service:${{ github.sha }}

        # DEPLOY
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /apps/bento-be-ws

            docker compose pull
            docker compose up -d
