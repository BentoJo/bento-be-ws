syntax = "proto3";

package auth;

message UserInfo {
    string id = 1;
    string email = 2;
    string firstName = 3;
    string lastName = 4;
    string avatarUrl = 5;
    string bio = 6;
    string phone = 7;
    string dob = 8;
    string gender = 9;
    string authStatus = 10;
    string globalRole = 11;
    string createdAt = 12;
    string updatedAt = 13;
}