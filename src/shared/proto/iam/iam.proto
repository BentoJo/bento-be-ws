syntax = "proto3";

package user;

service UserService {
  rpc GetUser (GetUserRequest) returns (UserProfile);
  rpc UpdateUser (UpdateUserRequest) returns (UserProfile);
  rpc GetUsersByIds (GetUsersByIdsRequest) returns (UsersResponse);
}

message GetUserRequest {
  string userId = 1;
}

message UpdateUserRequest {
  string          userId    = 1;
  optional string firstName = 2;
  optional string lastName  = 3;
  optional string avatarUrl = 4;
  optional string bio       = 5;
  optional string phone     = 6;
  optional string dob       = 7;
  optional string gender    = 8;
}

message GetUsersByIdsRequest {
  repeated string userIds = 1;
}

message UsersResponse {
  repeated UserProfile users = 1;
}

message UserProfile {
  string id         = 1;
  string email      = 2;
  string firstName  = 3;
  string lastName   = 4;
  string avatarUrl  = 5;
  string bio        = 6;
  string phone      = 7;
  string dob        = 8;
  string gender     = 9;
  string globalRole = 10;
  string createdAt  = 11;
}