syntax = "proto3";

package workspace;

import "../common.proto";

service WorkspaceService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse); // Done

  rpc CreateWorkspace(CreateWorkspaceRequest) returns (WorkspaceResponse); // Done

  rpc GetWorkspace(GetWorkspaceRequest) returns (WorkspaceResponse); // Done

  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (WorkspaceResponse); // Done!

  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (workspace.common.ActionResponse); // Done

  rpc RestoreWorkspace(RestoreWorkspaceRequest) returns (workspace.common.ActionResponse); // Done

  rpc ArchiveWorkspace(ArchiveWorkspaceRequest) returns (workspace.common.ActionResponse); // Later

  rpc UnarchiveWorkspace(UnarchiveWorkspaceRequest) returns (workspace.common.ActionResponse); // Later

  rpc TransferWorkspaceOwnership(TransferWorkspaceOwnershipRequest)
      returns (workspace.common.ActionResponse); // Done

  rpc ListUserWorkspaces(ListUserWorkspacesRequest)
      returns (ListUserWorkspacesResponse); // Done

  rpc GetWorkspaceOverview(GetWorkspaceOverviewRequest)
      returns (WorkspaceOverviewResponse); // Done

  rpc GetWorkspaceStats(GetWorkspaceStatsRequest)
      returns (WorkspaceStatsResponse);

  rpc RemoveWorkspaceLogo(RemoveWorkspaceLogoRequest)
      returns (WorkspaceResponse);
}

// NOTE: WorkspaceActionResponse and PaginationMeta were moved to common.proto.

// Create workspace
message HealthCheckRequest{}

message HealthCheckResponse {
  string status = 1;
}
message CreateWorkspaceRequest {
  string name = 1;
  optional string logoUrl = 2;
}

message WorkspaceResponse {
  string id = 1;

  string name = 2;

  optional string logoUrl = 3;

  string ownerId = 4;

  bool isArchived = 5;

  string createdAt = 6;

  optional string updatedAt = 7;
}

// Get

message GetWorkspaceRequest {
  string workspaceId = 1;
}

// Update

message UpdateWorkspaceRequest {
  string workspaceId = 1;

  optional string name = 2;

  optional string logoUrl = 3;
}

// Delete

message DeleteWorkspaceRequest {
  string workspaceId = 1;
}

// Restore
message RestoreWorkspaceRequest {
  string workspaceId = 1;
}

// Archive
message ArchiveWorkspaceRequest {
  string workspaceId = 1;
}

message UnarchiveWorkspaceRequest {
  string workspaceId = 1;
}

// Transfer ownership
message TransferWorkspaceOwnershipRequest {
  string workspaceId = 1;

  string newOwnerId = 2;
}

// List Users
message ListUserWorkspacesRequest {
  int32 page = 1;

  int32 limit = 2;

  optional string search = 3;

  optional bool includeArchived = 4;
}

message WorkspaceListItem {
  string id = 1;

  string name = 2;

  optional string logoUrl = 3;

  bool isArchived = 4;

  string roleId = 5;
}

message ListUserWorkspacesResponse {
  repeated WorkspaceListItem workspaces = 1;

  workspace.common.PaginationMeta pagination = 2;
}

//Overview 
message GetWorkspaceOverviewRequest {
  string workspaceId = 1;
}

// Edit ===================================================
message WorkspaceOverviewResponse {
  int32 totalBoards = 1;
  int32 totalMembers = 2;
  int32 totalTeams = 3;

  int32 totalCards = 4;
  int32 completedCards = 5;
  int32 overdueCards = 6;

  repeated BoardPreview boardsPreview = 7;

  Permissions permissions = 8;

  string lastUpdatedAt = 9;
}

message BoardPreview {
  string id = 1;
  string name = 2;
  string visibility = 3;
  int32 columnsCount = 4;
  int32 cardCount = 5;
}

message Permissions {
  bool canCreateBoard = 1;
  bool canInviteMembers = 2;
  bool canEditWorkspace = 3;
}
//Stats

// Note =========================================
message GetWorkspaceStatsRequest {
  string workspaceId = 1;
}

message WorkspaceStatsResponse {
  int32 totalBoards = 1;

  int32 totalColumns = 2;

  int32 totalCards = 3;

  int32 completedCards = 4;

  int32 archivedCards = 5;

  int32 totalMembers = 6;

  int32 totalTeams = 7;
}


message RemoveWorkspaceLogoRequest {
  string workspaceId = 1;
}

